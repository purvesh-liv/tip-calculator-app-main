<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="logo">
      <span>SPLI</span>
      <span>TTER</span>
    </h1>

    <section class="calculator">
      <div class="left-panel">
        <div class="form-group">
          <label for="bill">Bill</label>
          <div class="input-wrapper">
            <span class="input-icon">$</span>
            <input type="number" id="bill" placeholder="0" />
          </div>
        </div>

        <div class="form-group">
          <label>Select Tip %</label>

          <div class="tip-buttons">
            <button class="tip-btn" type="button" data-tip="5">5%</button>
            <button class="tip-btn" type="button" data-tip="10">10%</button>
            <button class="tip-btn active" type="button" data-tip="15">15%</button>
            <button class="tip-btn" type="button" data-tip="25">25%</button>
            <button class="tip-btn" type="button" data-tip="50">50%</button>
            <input
              type="number"
              class="custom-tip"
              id="customTip"
              placeholder="Custom"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="people">Number of People</label>
            <span class="error-msg">Can't be zero</span>
          </div>

          <div class="input-wrapper error">
            <span class="input-icon">👤</span>
            <input type="number" id="people" placeholder="0" />
          </div>
        </div>
      </div>

      <div class="right-panel">
        <div class="result-row">
          <div>
            <h2>Tip Amount</h2>
            <p>/ person</p>
          </div>
          <span class="amount" id="tipAmount">$0.00</span>
        </div>

        <div class="result-row">
          <div>
            <h2>Total</h2>
            <p>/ person</p>
          </div>
          <span class="amount" id="totalAmount">$0.00</span>
        </div>

        <button class="reset-btn" id="resetBtn" type="button">RESET</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
